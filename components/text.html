<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
       <link
      href="https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>

       <!-- Testimonials -Section -->
   <section class="relative overflow-hidden bg-[linear-gradient(90deg,_#7C4DFF_0%,_#FFF7D1_100%)] py-20 px-10 min-h-[600px] flex items-center justify-center">
  
  <div class="absolute left-10 top-10 opacity-20 pointer-events-none">
    <img src="/images/icons/commas.svg" alt="" class="w-[300px] lg:w-[450px]">
  </div>

  <div class="relative z-10 flex flex-col items-center w-full max-w-[1200px]">
    
    <h2 class="font-heading font-bold text-[48px] leading-tight tracking-wide uppercase text-white mb-16">
      Testimonials
    </h2>

    <div class="flex flex-row items-center justify-center gap-8 md:gap-16 w-full">
      
      <button class="w-12 h-12 flex items-center justify-center rounded-full bg-white/20 text-white hover:bg-white/30 transition-colors">
        <i class="bx bx-chevron-left text-3xl"></i>
      </button>

      <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-[32px] p-10 md:p-14 flex flex-col items-center text-center max-w-[500px] shadow-2xl">
        
        <div class="mb-6">
          <img src="./images/main-images/profileimg.png" alt="Leul Mekonen" class="w-28 h-28 rounded-full border-4 border-white/20 object-cover">
        </div>

        <div class="mb-6">
          <h3 class="font-heading font-bold text-2xl text-white">Leul Mekonen</h3>
          <p class="text-white/70 text-lg">Freelancer</p>
        </div>

        <p class="font-body font-normal text-white text-lg leading-relaxed italic">
          "Workora completely changed how I work. I used to bounce between cafés, but now I have a space that feels like mine with better coffee and zero distractions."
        </p>
      </div>

      <button class="w-12 h-12 flex items-center justify-center rounded-full bg-white/20 text-white hover:bg-white/30 transition-colors">
        <i class="bx bx-chevron-right text-3xl"></i>
      </button>

    </div>
  </div>
</section>
  </body>
</html>
